name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # 既定は wrangler 3 系。assets 専用 Worker（main なし）は 4 系が必要。
          # package.json の devDependencies.wrangler と揃えること。
          wranglerVersion: "4.114.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Vercel 時代は deployment_status イベントで discord-notify.yml が通知していたが、
      # Cloudflare では発火しないため、このワークフロー自身から通知する。
      # 記事タイトルが commit メッセージに入る（引用符・改行・日本語を含みうる）ので、
      # 文字列連結ではなく jq で JSON を組み立てること。
      - name: Notify Discord (成功)
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg desc "${COMMIT_MSG:-手動実行}" \
            --arg repo "$REPO" \
            '{embeds:[{
              title: "🚀 デプロイ完了 (Production)",
              url: "https://www.kechiiiiin.com/",
              description: $desc,
              color: 3066993,
              footer: {text: $repo}
            }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Notify Discord (失敗)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg desc "${COMMIT_MSG:-手動実行}" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            '{embeds:[{
              title: "❌ デプロイ失敗",
              url: $url,
              description: ($desc + "\n\nログを確認してください"),
              color: 15158332,
              footer: {text: $repo}
            }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"
